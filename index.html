<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Mi Ruta">
<meta name="theme-color" content="#0F5C4D">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Mi Ruta</title>
<style>
@font-face{font-family:"Public Sans";src:url(fonts/public-sans-400.woff2) format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Public Sans";src:url(fonts/public-sans-700.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:"Barlow Cond";src:url(fonts/barlow-condensed-600.woff2) format("woff2");font-weight:600;font-display:swap}
:root{
  --pino:#0F5C4D; --pino-2:#0B4A3E; --pino-claro:#E2EFEA; --pino-medio:#9CC5B8;
  --papel:#F6F8F7; --blanco:#FFFFFF; --tinta:#1B2422; --gris:#5C6965; --gris-claro:#8A9692; --linea:#D6DEDB;
  --ambar:#F2B705; --ambar-fondo:#FFF4C9; --ambar-tinta:#6B4E00;
  --rojo:#C62E2E; --rojo-fondo:#FCE6E4; --rojo-tinta:#8E1A1A;
  --verde:#1F8A4C; --verde-fondo:#DFF2E6; --verde-tinta:#14572F;
  --cond:"Barlow Cond","Arial Narrow",sans-serif;
  --r-s:6px; --r-m:10px; --r-l:16px;
  --rail:92px; --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--papel);color:var(--tinta);font:400 17px/1.45 "Public Sans",system-ui,-apple-system,sans-serif;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--pino);outline-offset:2px}
h1,h2,h3{margin:0;font-weight:700;line-height:1.2}
h1{font-size:28px}
h2{font-size:20px}
h3{font-size:17px}
p{margin:0}
.muted{color:var(--gris)}
.small{font-size:14px}
.num{font-variant-numeric:tabular-nums}
.cond{font-family:var(--cond);font-weight:600;letter-spacing:.01em}

/* ---------- layout ---------- */
#nav{position:fixed;z-index:20;background:var(--pino);display:flex}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;color:#CFE5DD;font-size:13px;padding:8px 2px;min-height:58px}
#nav button svg{width:26px;height:26px}
#nav button[aria-current="page"]{color:#fff}
#nav button[aria-current="page"] svg{stroke-width:2.4}
#nav .brand{display:none}
main{padding:calc(18px + var(--safe-t)) 18px calc(96px + var(--safe-b));max-width:1120px;margin:0 auto}
@media (min-width:900px){
  #nav{left:0;top:0;bottom:0;width:var(--rail);flex-direction:column;justify-content:flex-start;padding-top:calc(14px + var(--safe-t))}
  #nav button{flex:0 0 auto;min-height:76px}
  #nav .brand{display:block;color:#fff;font-family:var(--cond);font-size:22px;text-align:center;padding:6px 0 16px;line-height:1}
  main{margin-left:var(--rail);padding:calc(26px + var(--safe-t)) 34px 40px;max-width:calc(1120px + var(--rail))}
  body.has-nav main{margin-left:var(--rail)}
}
@media (max-width:899px){
  #nav{left:0;right:0;bottom:0;padding-bottom:var(--safe-b);box-shadow:0 -1px 0 rgba(0,0,0,.08)}
}
.page-head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:20px}
.page-head .sub{color:var(--gris);margin-top:4px}
.row{display:flex;align-items:center;gap:10px}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.stack>*+*{margin-top:12px}
.section{margin-top:28px}
.section>h2{margin-bottom:12px}
.split{display:grid;gap:24px}
@media (min-width:900px){.split{grid-template-columns:1.25fr 1fr}}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:var(--r-m);border:1.5px solid var(--pino);background:var(--blanco);color:var(--pino);font-weight:700;text-decoration:none}
.btn.primary{background:var(--pino);color:#fff}
.btn.primary:active{background:var(--pino-2)}
.btn.quiet{border-color:var(--linea);color:var(--tinta)}
.btn.danger{border-color:var(--rojo);color:var(--rojo)}
.btn.small{min-height:38px;padding:0 12px;font-size:15px}
.btn.block{width:100%}
.btn:disabled{opacity:.45}
.btn svg{width:20px;height:20px}
.link{background:none;border:0;padding:6px 0;color:var(--pino);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:44px;padding:0 15px;border-radius:999px;border:1.5px solid var(--linea);background:var(--blanco);display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.chip[aria-pressed="true"]{background:var(--pino);border-color:var(--pino);color:#fff}
.chip .ord{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:#fff;color:var(--pino);font-size:14px}
.chip.x{padding-right:6px}
.chip.x button{border:0;background:none;width:32px;height:32px;border-radius:50%;font-size:20px;line-height:1;color:var(--gris)}
.scroll-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.scroll-x::-webkit-scrollbar{display:none}
.scroll-x .chips{flex-wrap:nowrap;padding-bottom:2px}
.scroll-x .chip{flex:0 0 auto}
label.field{display:block}
label.field>span{display:block;font-size:14px;color:var(--gris);margin-bottom:5px;font-weight:700}
input[type=text],input[type=number],input[type=date],input[type=tel],input[type=search],select,textarea{width:100%;min-height:46px;padding:9px 12px;border:1.5px solid var(--linea);border-radius:var(--r-s);background:var(--blanco)}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--pino);outline:none}
.search{position:relative}
.search input{padding-left:42px}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--gris)}
.grid2{display:grid;gap:12px;grid-template-columns:1fr 1fr}
.grid3{display:grid;gap:12px;grid-template-columns:repeat(3,1fr)}
@media (max-width:560px){.grid3{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}}
.stepper{display:inline-flex;align-items:center;border:1.5px solid var(--linea);border-radius:var(--r-s);background:#fff}
.stepper button{width:44px;height:44px;border:0;background:none;font-size:22px;color:var(--pino);font-weight:700}
.stepper input{width:58px;min-height:44px;border:0;text-align:center;padding:0;border-left:1px solid var(--linea);border-right:1px solid var(--linea);border-radius:0}
.toggle{display:flex;align-items:center;gap:10px;min-height:44px}
.toggle input{width:24px;height:24px;accent-color:var(--pino)}

/* ---------- panels & lists ---------- */
.panel{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r-l);padding:18px}
.panel.tint{background:var(--pino-claro);border-color:transparent}
.list{background:var(--blanco);border:1px solid var(--linea);border-radius:var(--r-l);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--linea);min-height:64px;background:none;width:100%;text-align:left;border-left:0;border-right:0;border-bottom:0}
.item:first-child{border-top:0}
button.item:active{background:var(--papel)}
.item .t{font-weight:700}
.item .s{font-size:14px;color:var(--gris)}
.item .amt{font-weight:700;white-space:nowrap;text-align:right}
.item.bar{position:relative;padding-left:22px}
.item.bar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--linea)}
.item.bar.morosa::before{background:var(--rojo)}
.item.bar.porvencer::before,.item.bar.recoger::before{background:var(--ambar)}
.item.bar.aldia::before{background:var(--verde)}
.group-h{padding:10px 16px;background:var(--papel);border-top:1px solid var(--linea);font-family:var(--cond);font-size:21px;color:var(--pino)}
.group-h:first-child{border-top:0}
.chev{width:20px;height:20px;color:var(--gris-claro);flex:0 0 auto}
.empty{padding:28px 18px;text-align:center;color:var(--gris)}

/* status tags: color + icon + word */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:700;padding:3px 9px 3px 7px;border-radius:999px;white-space:nowrap;line-height:1.3}
.tag svg{width:14px;height:14px}
.tag.morosa{background:var(--rojo-fondo);color:var(--rojo-tinta)}
.tag.porvencer,.tag.recoger{background:var(--ambar-fondo);color:var(--ambar-tinta)}
.tag.aldia,.tag.pagada{background:var(--verde-fondo);color:var(--verde-tinta)}
.tag.toca{background:#fff;color:var(--pino);border:1.5px solid var(--pino-medio)}
.tag.excel{background:var(--papel);color:var(--gris);border:1px solid var(--linea)}
.tag.hecha{background:var(--pino);color:#fff}

/* ---------- route line (the signature element) ---------- */
.route{display:flex;align-items:flex-start;gap:0;padding:8px 4px 4px;overflow-x:auto}
.station{flex:1 1 0;min-width:150px;position:relative;padding-top:34px}
.station::before{content:"";position:absolute;top:13px;left:0;right:0;height:8px;background:var(--pino)}
.station:first-child::before{left:13px}
.station:last-child::before{right:calc(100% - 26px)}
.station:only-child::before{display:none}
.station .stop{position:absolute;top:2px;left:2px;width:30px;height:30px;border-radius:50%;background:#fff;border:7px solid var(--pino);z-index:1}
.station h3{font-family:var(--cond);font-weight:600;font-size:34px;line-height:1;color:var(--pino);margin:10px 0 6px;letter-spacing:.005em}
.nb{width:34px;height:34px;border-radius:50%;border:2px solid var(--pino-medio);background:#fff;color:var(--pino);display:inline-grid;place-items:center;font-family:var(--cond);font-weight:600;font-size:20px;flex:0 0 auto;line-height:1}
.nb.on{background:var(--pino);border-color:var(--pino);color:#fff}
.plan-grid{display:grid;gap:0 24px}
.plan-side{margin-top:28px}
@media (min-width:900px){.plan-grid{grid-template-columns:1.45fr 1fr;align-items:start}.plan-side{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}}
.order-list{list-style:none;margin:0;padding:0}
.order-list li{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--linea)}
.order-list li:first-child{border-top:0}
.order-list .mv{width:42px;height:42px;border-radius:var(--r-s);border:1.5px solid var(--linea);background:#fff;color:var(--pino);font-size:20px;font-weight:700;flex:0 0 auto}
.order-list .mv:disabled{opacity:.3}
.chip.on{background:var(--pino);border-color:var(--pino);color:#fff}
.chip.on.x button{color:#fff}
.chip.x button.plain{width:auto;height:auto;border-radius:0;font-size:16px;font-weight:700;color:inherit;padding:0;display:inline-flex;align-items:center;gap:6px;min-height:42px}
.chip.x button.plain small{font-weight:400;opacity:.8;font-size:13px}
.route.many .station{min-width:120px}
.route.many .station h3{font-size:26px}
.station .dots{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;padding-right:12px}
.station .dot{width:14px;height:14px;border-radius:50%;border:2.5px solid var(--pino);background:#fff}
.station .dot.done{background:var(--pino)}
.progress-line{display:flex;align-items:baseline;gap:16px;flex-wrap:wrap;margin-top:14px;padding-top:14px;border-top:1px solid var(--linea)}
.progress-line b{font-family:var(--cond);font-size:28px;font-weight:600;color:var(--tinta)}

/* ---------- dashboard ---------- */
.hero-num{font-family:var(--cond);font-weight:600;font-size:64px;line-height:.95;color:var(--tinta);letter-spacing:-.005em}
.meter{position:relative;height:18px;border-radius:9px;background:var(--pino-claro);margin:18px 0 8px;overflow:visible}
.meter .fill{position:absolute;left:0;top:0;bottom:0;border-radius:9px;background:var(--pino)}
.meter .goal{position:absolute;top:-6px;bottom:-6px;width:3px;background:var(--tinta);border-radius:2px}
.stat{padding:14px 16px;border-radius:var(--r-m);background:var(--blanco);border:1px solid var(--linea)}
.stat .v{font-family:var(--cond);font-weight:600;font-size:34px;line-height:1.05}
.stat .l{font-size:14px;color:var(--gris);font-weight:700}
.stat.morosa{border-left:7px solid var(--rojo)}
.stat.porvencer{border-left:7px solid var(--ambar)}
.stat.total{border-left:7px solid var(--pino)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-family:"Public Sans",sans-serif;font-size:13px;fill:var(--gris)}
.chart .bar{fill:var(--pino)}
.chart .bar.sel{fill:var(--pino-2)}
.chart .hit{fill:transparent;cursor:pointer}
.chart .hit:hover+.bar,.chart .hit:focus+.bar{fill:var(--pino-2)}
.chart .grid{stroke:var(--linea);stroke-width:1}
.chart .goal-line{stroke:var(--tinta);stroke-width:1.5;stroke-dasharray:5 4}
.chart .lbl-sel{fill:var(--tinta);font-weight:700}
#tip{position:fixed;z-index:60;pointer-events:none;background:var(--tinta);color:#fff;padding:7px 10px;border-radius:8px;font-size:14px;line-height:1.3;opacity:0;transform:translate(-50%,-110%);transition:opacity .12s}
#tip.on{opacity:1}
.hbar{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;align-items:center;gap:10px;padding:6px 0}
.hbar .track{height:14px;background:var(--papel);border-radius:3px}
.hbar .track i{display:block;height:100%;background:var(--pino);border-radius:0 4px 4px 0}
table.t{width:100%;border-collapse:collapse;font-size:15px}
table.t th{text-align:left;font-size:13px;color:var(--gris);font-weight:700;padding:8px 10px;border-bottom:1.5px solid var(--linea)}
table.t td{padding:10px;border-bottom:1px solid var(--linea);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;border-radius:var(--r-m);background:var(--ambar-fondo);color:var(--ambar-tinta);margin-bottom:18px}
.banner .grow{font-weight:700}

/* ---------- visit editor ---------- */
.v-head{position:sticky;top:0;z-index:10;background:var(--papel);padding:calc(10px + var(--safe-t)) 0 12px;margin:calc(-18px - var(--safe-t)) 0 8px;border-bottom:1px solid var(--linea)}
@media (min-width:900px){.v-head{margin-top:calc(-26px - var(--safe-t))}}
.v-sec{margin-top:22px}
.v-sec>h2{margin-bottom:10px;display:flex;align-items:center;gap:10px}
.who{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media (max-width:560px){.who{grid-template-columns:1fr}}
.who-box{border:1px solid var(--linea);border-radius:var(--r-m);background:#fff;padding:12px}
.who-box h3{font-size:15px;color:var(--gris);margin-bottom:8px}
.who-box .chip.who-chip{width:100%;justify-content:flex-start;border-radius:var(--r-s);margin-top:6px}
.who-box .chip small{font-weight:400;opacity:.8}
.prod-pick{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
.prod-pick button{min-height:62px;border:1.5px solid var(--linea);background:#fff;border-radius:var(--r-m);text-align:left;padding:8px 12px;display:flex;flex-direction:column;justify-content:center}
.prod-pick button.oferta{border-color:var(--pino-medio);background:var(--pino-claro)}
.prod-pick button b{font-size:15px;line-height:1.2}
.prod-pick button span{font-size:13px;color:var(--gris)}
.line{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--linea)}
.line:first-child{border-top:0}
.line .price{width:96px}
.line .price input{text-align:right}
input.need{border-color:var(--rojo);background:var(--rojo-fondo)}
.line .lt{min-width:84px;text-align:right;font-weight:700}
.line .rm{width:40px;height:40px;border:0;background:none;color:var(--gris);font-size:22px}
@media (max-width:560px){.line{grid-template-columns:1fr auto;}.line .lt{grid-column:2}}
.total-row{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:6px;border-top:2px solid var(--tinta)}
.total-row b{font-family:var(--cond);font-size:34px;font-weight:600}
.money-in{display:flex;align-items:center;border:1.5px solid var(--linea);border-radius:var(--r-s);background:#fff;padding-left:14px}
.money-in:focus-within{border-color:var(--pino)}
.money-in span{font-family:var(--cond);font-size:34px;color:var(--gris)}
.money-in input{border:0;font-family:var(--cond);font-weight:600;font-size:38px;min-height:64px;padding:4px 10px}
.money-in input:focus{outline:none}
.inv-grid{display:grid;gap:8px 16px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.inv-grid .r{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:4px 0}
.savebar{position:sticky;bottom:calc(66px + var(--safe-b));z-index:9;display:flex;gap:10px;justify-content:flex-end;padding:12px 0;margin-top:26px;background:linear-gradient(to top,var(--papel) 70%,rgba(246,248,247,0))}
@media (min-width:900px){.savebar{bottom:0}}

/* ---------- sheets / modals ---------- */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(20,30,28,.45);display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.overlay{align-items:center}}
.sheet{background:var(--papel);width:100%;max-width:640px;max-height:92vh;overflow:auto;border-radius:var(--r-l) var(--r-l) 0 0;padding:20px 20px calc(20px + var(--safe-b))}
@media (min-width:700px){.sheet{border-radius:var(--r-l)}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px}
.close{width:44px;height:44px;border-radius:50%;border:1px solid var(--linea);background:#fff;font-size:22px;line-height:1}
#toast{position:fixed;left:50%;bottom:calc(84px + var(--safe-b));transform:translateX(-50%) translateY(20px);z-index:70;background:var(--tinta);color:#fff;padding:12px 18px;border-radius:var(--r-m);font-weight:700;opacity:0;pointer-events:none;transition:all .2s;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:900px){#toast{bottom:28px;margin-left:calc(var(--rail)/2)}}

/* ---------- report ---------- */
.report{background:#fff;border:1px solid var(--linea);border-radius:var(--r-l);padding:24px}
.report p+p{margin-top:10px}
.report h3{margin:22px 0 8px}
@media print{
  #nav,.no-print,.page-head .btn{display:none!important}
  main{margin:0!important;padding:0!important;max-width:none}
  body{background:#fff}
  .report{border:0;padding:0}
}
.preview-bar{background:var(--ambar-fondo);color:var(--ambar-tinta);padding:9px 18px;font-size:14px;font-weight:700}
@media (min-width:900px){.preview-bar{margin-left:var(--rail)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<nav id="nav" aria-label="Secciones"></nav>
<main id="main"><p class="muted">Cargando…</p></main>
<div id="tip" role="status"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
"use strict";
/* =========================================================
   Mi Ruta — app de ventas para visitas a farmacias
   Datos guardados en este dispositivo (IndexedDB).
   ========================================================= */
const APP_VERSION = "1.3";
const TODAY_OVERRIDE = null; // para pruebas: "2026-11-16"

/* ---------- utilidades ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const r2 = n => Math.round((Number(n) || 0) * 100) / 100;
const money = n => (n < 0 ? "-$" : "$") + Math.abs(r2(n)).toLocaleString("en-US", {minimumFractionDigits: 2, maximumFractionDigits: 2});
const money0 = n => "$" + Math.round(n || 0).toLocaleString("en-US");
const pad = n => String(n).padStart(2, "0");
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => TODAY_OVERRIDE || iso(new Date());
const parseISO = s => { const [y, m, d] = String(s).split("-").map(Number); return new Date(y, (m || 1) - 1, d || 1); };

/* ---------- almacenamiento (IndexedDB con respaldo en memoria) ---------- */
const Store = {
  db: null, mem: null,
  async open() {
    if (this.db) return this.db;
    this.db = await new Promise((res, rej) => {
      const r = indexedDB.open("miruta", 1);
      r.onupgradeneeded = () => r.result.createObjectStore("kv");
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
    return this.db;
  },
  async get(k) {
    try {
      const db = await this.open();
      return await new Promise((res, rej) => { const q = db.transaction("kv").objectStore("kv").get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); });
    } catch (e) {
      try { const v = localStorage.getItem("miruta:" + k); return v ? JSON.parse(v) : (this.mem && this.mem[k]); } catch (_) { return this.mem && this.mem[k]; }
    }
  },
  async set(k, v) {
    try {
      const db = await this.open();
      await new Promise((res, rej) => { const t = db.transaction("kv", "readwrite"); t.objectStore("kv").put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); });
      return true;
    } catch (e) {
      this.mem = this.mem || {}; this.mem[k] = v;
      try { localStorage.setItem("miruta:" + k, JSON.stringify(v)); } catch (_) {}
      return false;
    }
  },
};

/* ---------- datos derivados ---------- */
let D = {rev: -1};
const P = id => D.ph[id];
function saleBalance(s) { return r2(s.total - (s.payments || []).reduce((a, p) => a + (Number(p.amount) || 0), 0)); }
function saleStatus(s, t = today()) {
  const bal = saleBalance(s);
  if (bal <= 0.005) return {k: "pagada", bal: 0};
  if (!isCredit(s.term)) return {k: "recoger", bal, label: "Recoger pago"};
  const d = daysBetween(t, s.dueDate);
  if (d < 0) return {k: "morosa", bal, days: -d, label: `${plural(-d, "día", "días")} tarde`};
  if (d <= (S.settings.warnDays ?? 5)) return {k: "porvencer", bal, days: d, label: d === 0 ? "Vence hoy" : `Vence en ${plural(d, "día", "días")}`};
  return {k: "aldia", bal, days: d, label: `Vence en ${plural(d, "día", "días")}`};
}
function derive() {
  if (D.rev === rev) return D;
  const t = today();
  const ph = {};
  for (const p of S.pharmacies) ph[p.id] = {p, sales: [], visits: [], total: 0, last: null, freq: null, bal: 0, worst: null, dates: []};
  for (const s of S.sales) {
    const x = ph[s.pharmacyId]; if (!x) continue;
    x.sales.push(s); x.total += s.total;
    if (!x.last || s.date > x.last) x.last = s.date;
    const st = saleStatus(s, t); s._st = st;
    if (st.k !== "pagada") {
      x.bal += st.bal;
      const rank = {morosa: 3, porvencer: 2, recoger: 1, aldia: 0};
      if (!x.worst || rank[st.k] > rank[x.worst]) x.worst = st.k;
    }
  }
  for (const v of S.visits) { const x = ph[v.pharmacyId]; if (x) x.visits.push(v); }
  for (const id in ph) {
    const x = ph[id];
    x.sales.sort((a, b) => a.date < b.date ? 1 : -1);
    x.visits.sort((a, b) => a.date < b.date ? 1 : (a.date > b.date ? -1 : (a.time < b.time ? 1 : -1)));
    const dates = [...new Set(x.sales.map(s => s.date))].sort();
    x.dates = dates;
    if (dates.length >= 2) x.freq = Math.round(daysBetween(dates[0], dates[dates.length - 1]) / (dates.length - 1));
    x.since = x.last ? daysBetween(x.last, t) : null;
    x.toca = x.freq && x.since != null && x.since >= Math.max(7, x.freq);
    x.bal = r2(x.bal);
    x.lastVisit = x.visits[0] || null;
  }
  const pueblos = [...new Set(S.pharmacies.filter(p => p.active !== false).map(p => p.pueblo).concat(S.extraPueblos || []))].sort((a, b) => a.localeCompare(b, "es"));
  D = {rev, ph, pueblos, t};
  return D;
}

function phLabel(id) { const p = P(id)?.p; return p ? p.name : "Farmacia"; }

async function leaveDraft() {

function saveVisit() {
  const d = draft; const x = P(d.pharmacyId);
  const quick = d.mode === "rapida";
  const hasSale = d.actions.includes("Venta");
  if (hasSale && quick) {
    if (!d.items.length) { toast("Marca qué productos vendiste, o quita Venta"); return; }
    if (!(parseFloat(d.quickTotal) > 0)) { toast("Escribe el total de la orden"); return; }
  }
  if (hasSale && !quick && !d.items.length) { toast("Añade al menos un producto a la venta, o quita Venta"); return; }
  const noPrice = hasSale && !quick && d.items.find(i => !(i.price > 0));
  if (noPrice) { toast(`Falta el precio de ${noPrice.name}`); return; }
  if (!d.actions.length && !d.other && !d.notes && !d.spoke.length && !d.otherName) { toast("Marca qué hiciste en la visita"); return; }
  const vid = d.id || uid("v");
  // venta
  let saleId = d.saleId;
  if (hasSale) {
    const total = quick ? r2(d.quickTotal) : r2(d.items.reduce((a, i) => a + i.qty * i.price, 0));
    const days = termDays(d.term);
    let s = saleId && S.sales.find(s => s.id === saleId);
    if (!s) { s = {id: uid("s"), source: "app", payments: []}; S.sales.push(s); saleId = s.id; }
    Object.assign(s, {date: d.date, pharmacyId: d.pharmacyId, mode: quick ? "rapida" : "detallada",
      items: d.items.map(i => quick ? {pid: i.pid, name: i.name, kind: i.kind, qty: null, price: null} : {pid: i.pid, name: i.name, kind: i.kind, qty: Number(i.qty), price: r2(i.price)}), total, term: d.term,
      dueDate: days ? addDays(d.date, days) : d.date, note: d.saleNote, visitId: vid, contact: (d.spoke.map(r => x.p.contacts[r]).concat(d.otherName ? [d.otherName] : [])).filter(Boolean).join(", ")});
    s.payments = (s.payments || []).filter(p => !p.auto);
    if (!days && !d.pending) s.payments.push({date: d.date, amount: total, method: d.term, auto: true});
    // recordar precios de esta farmacia
    x.p.prices = x.p.prices || {};
    if (!quick) for (const i of d.items) if (i.kind !== "oferta") x.p.prices[i.pid] = r2(i.price);
    x.p.term = d.term;
  } else if (saleId) {
    S.sales = S.sales.filter(s => s.id !== saleId); saleId = null;
  }
  // cobros
  for (const s of S.sales) s.payments = (s.payments || []).filter(p => p.visitId !== vid);
  for (const [sid, cl] of Object.entries(d.collect)) {
    const s = S.sales.find(s => s.id === sid); if (!s) continue;
    if (Number(cl.amount) > 0) s.payments.push({date: d.date, amount: r2(cl.amount), method: cl.method, visitId: vid});
  }
  const spoke = d.spoke.map(r => ({role: r, name: x.p.contacts[r] || ""}));
  if (d.otherName.trim()) spoke.push({role: "otro", area: d.otherArea, name: d.otherName.trim()});
  const inv = {}; for (const [k, v] of Object.entries(d.inventory)) if (v !== "" && v != null) inv[k] = Number(v);
  const visit = {id: vid, date: d.date, time: new Date().toTimeString().slice(0, 5), pharmacyId: d.pharmacyId, actions: d.actions.slice(), other: d.other.trim(), spoke,
    inventory: d.actions.includes("Verificar inventario") ? inv : {}, comp: {recetario: d.comp.recetario.slice(), piso: d.comp.piso.slice()}, saleId, notes: d.notes.trim()};
  const idx = S.visits.findIndex(v => v.id === vid);
  if (idx >= 0) { visit.time = S.visits[idx].time; S.visits[idx] = visit; } else S.visits.push(visit);
  changed(); draft = null; viewDate = visit.date;
  toast("Visita guardada");
  go("hoy");
}

let dashMonth = null, topPeriod = "mes";
function monthSales(k) { return S.sales.filter(s => monthKey(s.date) === k); }
function commission(total) {
  const c = S.settings.commission;
  if (total < c.target) return {amount: c.fixed, reached: false};
  return {amount: c.mode === "excedente" ? c.fixed + (total - c.target) * c.rate / 100 : total * c.rate / 100, reached: true};
}
function workdaysLeft(t) {
  const d = parseISO(t); const m = d.getMonth(); let n = 0;
  while (d.getMonth() === m) { const w = d.getDay(); if (w > 0 && w < 6) n++; d.setDate(d.getDate() + 1); }
  return n;
}

  const to = topPeriod === "mes" ? k + "-31" : t;
  const agg = {};
  for (const s of S.sales) if (s.date >= from && s.date <= to) { const a = agg[s.pharmacyId] = agg[s.pharmacyId] || {t: 0, n: 0}; a.t += s.total; a.n++; }
  const top = Object.entries(agg).sort((a, b) => b[1].t - a[1].t).slice(0, 10);
  const byP = {}; for (const s of ms) { const pu = P(s.pharmacyId)?.p.pueblo || "Otro"; byP[pu] = (byP[pu] || 0) + s.total; }
  const pList = Object.entries(byP).sort((a, b) => b[1] - a[1]);
  const pMax = pList.length ? pList[0][1] : 1;
  const toca = Object.values(D.ph).filter(x => x.p.active !== false && x.freq && x.since != null && x.since >= x.freq + 7 && x.since < 120).sort((a, b) => (b.since - b.freq) - (a.since - a.freq)).slice(0, 8);

  return `${backupDays === null || backupDays >= 7 ? `<div class="banner no-print"><span class="grow">${backupDays === null ? "Todavía no has guardado un respaldo de tus datos." : `Tu último respaldo fue ${ago(S.settings.lastBackup)}.`}</span><button class="btn small" data-act="backup">Guardar respaldo</button></div>` : ""}

function monthChart(keys, sel) {
  const tot = keys.map(k => monthSales(k).reduce((a, s) => a + s.total, 0));
  const target = S.settings.commission.target;
  const max = Math.max(target * 1.2, ...tot) ;
  const step = max > 40000 ? 10000 : 5000;
  const top = Math.ceil(max / step) * step;
  const W = 760, H = 260, L = 46, B = 30, T = 10, R = 8;
  const cw = (W - L - R) / keys.length, bw = Math.min(44, cw * 0.62);
  const y = v => T + (H - T - B) * (1 - v / top);
  let g = "";
  for (let v = 0; v <= top; v += step) g += `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v ? (v / 1000) + "k" : "0"}</text>`;
  const bars = keys.map((k, i) => {
    const x = L + cw * i + (cw - bw) / 2, h = Math.max(0, y(0) - y(tot[i])), yy = y(tot[i]);
    const r = Math.min(4, h);
    const path = h > 0 ? `M${x},${y(0)} V${yy + r} Q${x},${yy} ${x + r},${yy} H${x + bw - r} Q${x + bw},${yy} ${x + bw},${yy + r} V${y(0)} Z` : "";
    const [yr, m] = k.split("-");
    return `<rect class="hit" x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T}" tabindex="0" role="button" data-act="dashMonth" data-k="${k}" data-tip="${esc(cap(monthName(k)))}: ${money(tot[i])}" aria-label="${esc(monthName(k))}: ${money(tot[i])}"/>
      <path class="bar ${k === sel ? "sel" : ""}" d="${path}" pointer-events="none"/>
      <text x="${L + cw * i + cw / 2}" y="${H - 8}" text-anchor="middle" class="${k === sel ? "lbl-sel" : ""}">${MESES[Number(m) - 1].slice(0, 3)}</text>`;
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventas por mes">${g}${bars}<line class="goal-line" x1="${L}" x2="${W - R}" y1="${y(target)}" y2="${y(target)}" pointer-events="none"/><text x="${W - R}" y="${y(target) - 6}" text-anchor="end" style="fill:var(--tinta);font-weight:700">Meta</text></svg>`;
}
function wireChart() {
  const tip = $("#tip");
  $$(".chart .hit").forEach(el => {
    const show = () => { const r = el.getBoundingClientRect(); tip.textContent = el.dataset.tip; tip.style.left = (r.left + r.width / 2) + "px"; tip.style.top = (r.top + 30) + "px"; tip.classList.add("on"); };
    el.addEventListener("mouseenter", show); el.addEventListener("focus", show);
    el.addEventListener("mouseleave", () => tip.classList.remove("on")); el.addEventListener("blur", () => tip.classList.remove("on"));
  });
}

let repDate = null;
function buildReport(d) {
  const vis = visitsOn(d).sort((a, b) => (a.time || "") < (b.time || "") ? -1 : 1);
  const seller = S.settings.seller || "";
  const sales = vis.map(v => v.saleId && S.sales.find(s => s.id === v.saleId)).filter(Boolean);
  const totalSold = sales.reduce((a, s) => a + s.total, 0);
  const byTerm = {}; for (const s of sales) { const k = isCredit(s.term) ? "crédito" : s.term; byTerm[k] = (byTerm[k] || 0) + s.total; }
  const pays = []; for (const s of S.sales) for (const p of (s.payments || [])) if (p.visitId && p.date === d) pays.push({s, p});
  const totalPaid = pays.reduce((a, x) => a + Number(x.p.amount), 0);
  const pueblos = [...new Set(vis.map(v => P(v.pharmacyId)?.p.pueblo).filter(Boolean))];
  const prodAgg = {}; let allDetailed = true;
  for (const s of sales) for (const i of s.items) { const a = prodAgg[i.name] = prodAgg[i.name] || {q: 0, t: 0, n: 0}; a.n++; if (i.qty) { a.q += i.qty; a.t += i.qty * i.price; } else allDetailed = false; }
  const roleTxt = s => s.role === "otro" ? `${s.name} (${s.area === "Piso" ? "piso" : "recetario"})` : `${s.name} (${ROLES[s.role].toLowerCase()})`;
  const paras = [];
  if (!vis.length) paras.push(`No hay visitas registradas para el ${fmtLong(d)}.`);
  else {
    let p1 = `El ${fmtLong(d)} visité ${plural(vis.length, "farmacia", "farmacias")} en ${listJoin(pueblos)}. `;
    p1 += sales.length ? `Concreté ${plural(sales.length, "venta", "ventas")} por un total de ${money(totalSold)} (${Object.entries(byTerm).map(([k, v]) => `${k} ${money(v)}`).join(", ")}).` : "No hubo ventas.";
    if (pays.length) p1 += ` Recogí ${plural(pays.length, "pago", "pagos")} por ${money(totalPaid)}.`;
    paras.push(p1);
    for (const v of vis) {
      const p = P(v.pharmacyId)?.p; if (!p) continue;
      const s = v.saleId && S.sales.find(x => x.id === v.saleId);
      let t = `${p.name} (${p.pueblo}): `;
      const bits = [];
      if (v.spoke?.length) bits.push(`hablé con ${listJoin(v.spoke.map(roleTxt))}`);
      if (s) bits.push(`vendí ${listJoin(itemsText(s.items))} por ${money(s.total)}, término ${s.term}${isCredit(s.term) ? ` (cobro el ${fmtD(s.dueDate, {day: "numeric", month: "long"})})` : ""}`);
      const pv = pays.filter(x => x.p.visitId === v.id);
      if (pv.length) bits.push(`recogí ${money(pv.reduce((a, x) => a + Number(x.p.amount), 0))} en ${listJoin([...new Set(pv.map(x => x.p.method.toLowerCase()))])}`);
      const hasInv = v.inventory && Object.keys(v.inventory).length;
      const otherActs = (v.actions || []).filter(a => !["Venta", "Hablar con contacto", "Recoger cheque"].includes(a) && !(hasInv && a === "Verificar inventario")).map(a => a.toLowerCase());
      if (v.other) otherActs.push(v.other);
      if (otherActs.length) bits.push(`gestiones: ${otherActs.join(", ")}`);
      if (v.inventory && Object.keys(v.inventory).length) bits.push(`inventario: ${Object.entries(v.inventory).map(([k, q]) => `${product(k)?.name || k} ${q}`).join(", ")}`);
      if (v.comp && (v.comp.recetario.length || v.comp.piso.length)) bits.push(`competencia en recetario: ${v.comp.recetario.join(", ") || "ninguna"}; en piso: ${v.comp.piso.join(", ") || "ninguna"}`);
      t += bits.length ? cap(bits.join("; ")) + "." : "Visita registrada.";
      if (v.notes) t += ` Nota: ${v.notes}`;
      paras.push(t);
    }
  }
  const rowsV = vis.map(v => { const p = P(v.pharmacyId)?.p; const s = v.saleId && S.sales.find(x => x.id === v.saleId); return [p?.name || "", p?.pueblo || "", (v.spoke || []).map(x => x.name).join(", "), (v.actions || []).concat(v.other ? [v.other] : []).join(", "), s ? s.total : 0, s ? s.term : ""]; });
  const rowsP = Object.entries(prodAgg).map(([n, a]) => allDetailed ? [n, a.q, r2(a.t)] : [n, a.n]);
  const rowsC = pays.map(x => [P(x.s.pharmacyId)?.p.name || "", fmtD(x.s.date, {day: "numeric", month: "short"}), Number(x.p.amount), x.p.method]);
  const title = `Informe diario${seller ? " de " + seller : ""}`;
  return {d, title, subtitle: cap(fmtLong(d)), paras, rowsV, rowsP, rowsC, totalSold, totalPaid, pHead: allDetailed ? ["Producto", "Cantidad", "Total"] : ["Producto", "Farmacias"]};
}

async function copyRich(html, text) {

    if (navigator.clipboard && window.ClipboardItem) {
      await navigator.clipboard.write([new ClipboardItem({"text/html": new Blob([html], {type: "text/html"}), "text/plain": new Blob([text], {type: "text/plain"})})]);

    const div = document.createElement("div"); div.contentEditable = "true"; div.innerHTML = html; div.style.position = "fixed"; div.style.left = "-9999px"; document.body.appendChild(div);

}

async function deliverFile(blob, name) {

    catch (e) {
      if (e.name === "AbortError") return "cancel";
      const o = openSheet("Tu archivo está listo", `<p>${esc(name)}</p><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn primary" id="dfShare">Compartir o guardar</button></div>`);
      $("#dfShare", o).onclick = async () => { try { await navigator.share({files: [file], title: name}); closeSheet(); } catch (_) {} };
      return "sheet";
    }
  }
  const url = URL.createObjectURL(blob); const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
  return "download";
}

    const empty = !S.pharmacies.length && !S.sales.length;
    if (!empty && !(await confirmBox(`El respaldo tiene ${data.pharmacies.length} farmacias, ${data.sales.length} ventas y ${(data.visits || []).length} visitas. Va a reemplazar todo lo que hay ahora en este iPad.`, "Restaurar respaldo", true))) return;
    delete data.savedAt; S = migrate(data); changed(); await saveNow(); render(); toast("Respaldo restaurado");
  } catch (e) { toast("No se pudo leer el respaldo. Verifica que sea el archivo correcto."); }
}

/* =========================================================
   AJUSTES
   ========================================================= */
function viewAjustes() {
  const c = S.settings.commission;
  ensureXLSX();
  return `<div class="page-head"><div><h1>Ajustes</h1><div class="sub">Catálogo, competencia, comisión y respaldo</div></div></div>
    <div class="panel"><h2 style="margin-bottom:12px">Productos y ofertas</h2><p class="small muted" style="margin-bottom:10px">Las ofertas tienen precio fijo. El precio de los productos es el sugerido: en cada venta lo puedes cambiar y la app recuerda el último precio de cada farmacia. Los que están en rojo no tienen precio todavía.</p>
        <div style="overflow-x:auto"><table class="t" style="min-width:560px"><thead><tr><th>Nombre</th><th style="width:150px">Tipo</th><th class="r" style="width:130px">Precio</th><th style="width:100px">Inventario</th><th style="width:80px">Activo</th></tr></thead><tbody>
        ${S.products.map((p, i) => `<tr><td><input type="text" value="${esc(p.name)}" data-prod="${i}" data-f="name" aria-label="Nombre"></td>
          <td><select data-prod="${i}" data-f="kind" aria-label="Tipo"><option value="oferta" ${p.kind === "oferta" ? "selected" : ""}>Oferta</option><option value="producto" ${p.kind === "producto" ? "selected" : ""}>Producto</option></select></td>
          <td><input type="number" step="0.01" inputmode="decimal" style="text-align:right" class="${p.price > 0 ? "" : "need"}" value="${p.price || ""}" placeholder="Precio" data-prod="${i}" data-f="price" aria-label="Precio"></td>
          <td><input type="checkbox" style="width:24px;height:24px;accent-color:var(--pino)" ${p.inv ? "checked" : ""} data-prod="${i}" data-f="inv" aria-label="Lleva inventario"></td>
          <td><input type="checkbox" style="width:24px;height:24px;accent-color:var(--pino)" ${p.active ? "checked" : ""} data-prod="${i}" data-f="active" aria-label="Activo"></td></tr>`).join("")}</tbody></table></div>
        <button class="btn small" style="margin-top:12px" data-act="addProd">${ico("mas")}Añadir producto</button></div>
    <div class="split section"><div class="stack">
      ${["recetario", "piso"].map(area => `<div class="panel"><h2 style="margin-bottom:10px">Marcas de competencia en ${area}</h2>
        <div class="chips">${S.brands[area].map((b, i) => `<span class="chip x">${esc(b)}<button data-act="rmBrand" data-area="${area}" data-i="${i}" aria-label="Quitar ${esc(b)}">×</button></span>`).join("")}</div>
        <div class="row" style="margin-top:12px"><input type="text" id="ab-${area}" placeholder="Nueva marca"><button class="btn small" data-act="addBrand" data-area="${area}">Añadir</button></div></div>`).join("")}
      <div class="panel"><h2 style="margin-bottom:10px">Gestiones de la visita</h2>
        <div class="chips">${S.actions.map((b, i) => `<span class="chip x">${esc(b)}${["Venta", "Verificar inventario", "Recoger cheque"].includes(b) ? "" : `<button data-act="rmAction" data-i="${i}" aria-label="Quitar ${esc(b)}">×</button>`}</span>`).join("")}</div>
        <div class="row" style="margin-top:12px"><input type="text" id="newAction" placeholder="Nueva gestión"><button class="btn small" data-act="addAction">Añadir</button></div></div></div>
    <div class="stack">
      <div class="panel"><h2 style="margin-bottom:12px">Comisión</h2>
        <div class="grid2"><label class="field"><span>Meta del mes</span><input type="number" inputmode="decimal" value="${c.target}" data-set="commission.target"></label>
        <label class="field"><span>Fijo por debajo de la meta</span><input type="number" inputmode="decimal" value="${c.fixed}" data-set="commission.fixed"></label>
        <label class="field"><span>Porciento al llegar a la meta</span><input type="number" inputmode="decimal" step="0.1" value="${c.rate}" data-set="commission.rate"></label></div>
        <div style="margin-top:12px"><label class="toggle"><input type="radio" name="cm" value="total" ${c.mode !== "excedente" ? "checked" : ""} data-set-radio="commission.mode"> ${c.rate}% de toda la venta del mes</label>
        <label class="toggle"><input type="radio" name="cm" value="excedente" ${c.mode === "excedente" ? "checked" : ""} data-set-radio="commission.mode"> Fijo más ${c.rate}% de lo que pase de la meta</label></div></div>
      <div class="panel"><h2 style="margin-bottom:6px">Forma de registrar la venta</h2>
        <label class="toggle"><input type="radio" name="sm" value="rapida" ${S.settings.saleMode !== "detallada" ? "checked" : ""} data-set-radio="saleMode"> Rápida: marcar los productos y escribir el total de la orden de la compañía</label>
        <label class="toggle"><input type="radio" name="sm" value="detallada" ${S.settings.saleMode === "detallada" ? "checked" : ""} data-set-radio="saleMode"> Detallada: cantidad y precio de cada producto</label></div>
      <div class="panel"><h2 style="margin-bottom:12px">Créditos</h2><label class="field"><span>Avisar en amarillo cuando falten estos días para vencer</span><input type="number" inputmode="numeric" min="0" max="15" value="${S.settings.warnDays}" data-set="warnDays"></label></div>
      <div class="panel"><h2 style="margin-bottom:12px">Vendedora</h2><label class="field"><span>Nombre en el reporte</span><input type="text" value="${esc(S.settings.seller)}" data-set="seller"></label></div>
      <div class="panel tint"><h2 style="margin-bottom:6px">Respaldo</h2>
        <p class="small" style="margin-bottom:12px">Tus datos se guardan solo en este iPad. Guarda un respaldo cada semana en Archivos o envíatelo por email: es un Excel que también sirve para restaurar todo.${S.settings.lastBackup ? ` Último respaldo: ${esc(fmtD(S.settings.lastBackup, {day: "numeric", month: "long"}))}.` : ""}</p>
        <div class="row wrap"><button class="btn primary" data-act="backup">Guardar respaldo</button><label class="btn quiet" style="cursor:pointer">Restaurar respaldo<input type="file" accept=".xlsx" hidden data-act-change="restore"></label></div>
        ${storageOk ? "" : `<p class="small" style="margin-top:10px;color:var(--rojo-tinta)"><b>Aviso:</b> este navegador no permite guardar datos de forma permanente. Abre la app desde el ícono de la pantalla de inicio.</p>`}</div>
      <div class="panel"><h2 style="margin-bottom:6px">Empezar de cero</h2><p class="small muted" style="margin-bottom:12px">Borra todas las farmacias, ventas y visitas de este iPad.</p><button class="btn danger small" data-act="wipe">Borrar todos los datos</button></div>
      <p class="small muted">Mi Ruta ${APP_VERSION}</p></div></div>`;
}
function setPath(obj, path, val) { const ks = path.split("."); let o = obj; while (ks.length > 1) o = o[ks.shift()]; o[ks[0]] = val; }

/* =========================================================
   EVENTOS
   ========================================================= */
const A = {
  async nav(el) { if (route().view === "visita" && !(await leaveDraft())) return; go(el.dataset.to); },
  closeSheet() { closeSheet(); },
  planPueblo(el) {
    const p = el.dataset.p, pd = planDraft; const i = pd.pueblos.indexOf(p);
    if (i >= 0) { pd.pueblos.splice(i, 1); pd.stops = pd.stops.filter(id => P(id).p.pueblo !== p); }
    else pd.pueblos.push(p);
    render();
  },
  planToggle(el) { const s = planDraft.stops; const id = el.dataset.id; const i = s.indexOf(id); i >= 0 ? s.splice(i, 1) : s.push(id); keepScroll(render); },
  planMove(el) { const s = planDraft.stops; const i = Number(el.dataset.i), j = i + Number(el.dataset.d); if (j < 0 || j >= s.length) return; [s[i], s[j]] = [s[j], s[i]]; keepScroll(render); },
  planLoadRoute(el) {
    const r = S.routes.find(r => r.id === el.dataset.id); if (!r) return;
    const stops = r.stops.filter(id => P(id) && P(id).p.active !== false);
    const pueblos = r.pueblos.filter(pu => D.pueblos.includes(pu));
    for (const id of stops) { const pu = P(id).p.pueblo; if (!pueblos.includes(pu)) pueblos.push(pu); }
    Object.assign(planDraft, {pueblos, stops, routeId: r.id, saveAs: true, name: r.name});
    keepScroll(render);
  },
  async planDelRoute(el) {
    const r = S.routes.find(r => r.id === el.dataset.id); if (!r) return;
    if (!(await confirmBox(`¿Borrar la ruta guardada "${r.name}"? Las visitas y ventas no se tocan.`, "Borrar ruta", true))) return;
    S.routes = S.routes.filter(x => x.id !== r.id); if (planDraft && planDraft.routeId === r.id) { planDraft.routeId = null; planDraft.saveAs = false; }
    changed(); keepScroll(render);
  },
  planAll(el) {
    const ids = pueblosPharmacies(el.dataset.p).map(x => x.p.id);
    const allIn = ids.every(id => planDraft.stops.includes(id));
    planDraft.stops = allIn ? planDraft.stops.filter(id => !ids.includes(id)) : [...new Set(planDraft.stops.concat(ids))];
    render();
  },
  planSave() {
    const pd = planDraft;
    const pueblos = pd.pueblos.filter(pu => pd.stops.some(id => P(id).p.pueblo === pu));
    S.plans[pd.date] = {pueblos, stops: pd.stops.slice()};
    S.stopOrder = S.stopOrder || {};
    for (const pu of pueblos) { const sel = pd.stops.filter(id => P(id).p.pueblo === pu); S.stopOrder[pu] = sel.concat(pueblosOrder(pu).filter(id => !sel.includes(id))); }
    let msg = "Ruta guardada";
    if (pd.saveAs) {
      S.routes = S.routes || [];
      const name = (pd.name || "").trim() || defaultRouteName(pueblos) || "Ruta";
      const r = S.routes.find(r => r.id === pd.routeId) || S.routes.find(r => norm(r.name) === norm(name));
      if (r) Object.assign(r, {name, pueblos, stops: pd.stops.slice()}); else S.routes.push({id: uid("r"), name, pueblos, stops: pd.stops.slice()});
      msg = `Ruta "${name}" guardada para la próxima vez`;
    }
    planDraft = null; changed(); toast(msg); render();
  },
  planEdit() { const d = viewDate || today(); const p = S.plans[d] || {pueblos: [], stops: []}; planDraft = {date: d, pueblos: p.pueblos.slice(), stops: p.stops.slice(), routeId: null, saveAs: false, name: ""}; render(); },
  planCancel() { planDraft = null; render(); },
  pickVisit() { pickVisitSheet(); },
  pvPick(el) { closeSheet(); startVisit(el.dataset.id, el.dataset.date); },
  newVisit(el) { startVisit(el.dataset.id, el.dataset.date || viewDate || today()); },
  openVisit(el) { const v = S.visits.find(v => v.id === el.dataset.id); if (!v) return; draft = draftFromVisit(v); go("visita/" + v.id); },
  openPh(el) { go("farmacia/" + el.dataset.id); },
  editPh(el) { editPharmacySheet(el.dataset.id); },
  editContacts(el) { editContactsSheet(el.dataset.id); },
  vAction(el) { const a = el.dataset.a; const i = draft.actions.indexOf(a); i >= 0 ? draft.actions.splice(i, 1) : draft.actions.push(a); draft.dirty = true; keepScroll(render); },
  vSpoke(el) { const r = el.dataset.r; const i = draft.spoke.indexOf(r); i >= 0 ? draft.spoke.splice(i, 1) : draft.spoke.push(r); draft.dirty = true; keepScroll(render); },
  vAdd(el) {
    const q = product(el.dataset.id); const ph = P(draft.pharmacyId).p;
    const ex = draft.items.find(i => i.pid === q.id);
    if (ex) ex.qty++; else draft.items.push({pid: q.id, name: q.name, kind: q.kind, qty: 1, price: q.kind === "oferta" ? q.price : (ph.prices?.[q.id] ?? q.price)});
    draft.dirty = true; keepScroll(render);
  },
  vPick(el) {
    const q = product(el.dataset.id); const i = draft.items.findIndex(x => x.pid === q.id);
    i >= 0 ? draft.items.splice(i, 1) : draft.items.push({pid: q.id, name: q.name, kind: q.kind, qty: null, price: null});
    draft.dirty = true; keepScroll(render);
  },
  vQty(el) { const it = draft.items[el.dataset.i]; it.qty = Math.max(1, (Number(it.qty) || 0) + Number(el.dataset.d)); draft.dirty = true; keepScroll(render); },
  vRm(el) { draft.items.splice(el.dataset.i, 1); draft.dirty = true; keepScroll(render); },
  vTerm(el) { draft.term = el.dataset.t; draft.dirty = true; keepScroll(render); },
  vInv(el) { const k = el.dataset.id; const cur = Number(draft.inventory[k]) || 0; draft.inventory[k] = Math.max(0, cur + Number(el.dataset.d)); draft.dirty = true; keepScroll(render); },
  vComp(el) { const arr = draft.comp[el.dataset.area]; const b = el.dataset.b; const i = arr.indexOf(b); i >= 0 ? arr.splice(i, 1) : arr.push(b); draft.dirty = true; keepScroll(render); },
  vNewBrand(el) {
    const area = el.dataset.area; const inp = $("#newBrand-" + area); const b = inp.value.trim(); if (!b) return;
    if (!S.brands[area].includes(b)) { S.brands[area].push(b); changed(); }
    if (!draft.comp[area].includes(b)) draft.comp[area].push(b);
    draft.dirty = true; keepScroll(render);
  },
  async vCancel() { if (await leaveDraft()) history.length > 1 ? history.back() : go("hoy"); },
  vSave() { saveVisit(); },
  async vDelete() {
    if (!(await confirmBox("¿Borrar esta visita? También se borra su venta y los cobros que registraste en ella.", "Borrar visita", true))) return;
    const id = draft.id; const v = S.visits.find(v => v.id === id);
    if (v && v.saleId) S.sales = S.sales.filter(s => s.id !== v.saleId);
    for (const s of S.sales) s.payments = (s.payments || []).filter(p => p.visitId !== id);
    S.visits = S.visits.filter(v => v.id !== id); draft = null; changed(); toast("Visita borrada"); go("hoy");
  },
  phPueblo(el) { phFilter.pueblo = el.dataset.p; render(); },
  cobFilter(el) { cobFilter = el.dataset.k; render(); },
  paySale(el) { paySheet(el.dataset.id); },
  dashMonth(el) { if (el.dataset.k) { dashMonth = el.dataset.k; $("#tip").classList.remove("on"); keepScroll(render); } },
  topPeriod(el) { topPeriod = el.dataset.k; keepScroll(render); },
  repCopy() { const R = buildReport(repDate || viewDate || today()); copyRich(reportHTML(R, true), reportText(R)).then(ok => toast(ok ? "Reporte copiado. Pégalo en el email." : "No se pudo copiar")); },
  repMail() { const R = buildReport(repDate || viewDate || today()); location.href = `mailto:?subject=${encodeURIComponent(R.title + ", " + R.subtitle)}&body=${encodeURIComponent(reportText(R))}`; },
  repXlsx() { exportReportXlsx(buildReport(repDate || viewDate || today())).catch(() => toast("No se pudo preparar el Excel")); },
  repPrint() { window.print(); },
  backup() { exportBackup(); },
  addProd() { S.products.push({id: uid("p_"), name: "Producto nuevo", kind: "producto", price: 0, desc: "", inv: true, active: true}); changed(); keepScroll(render); },
  rmBrand(el) { S.brands[el.dataset.area].splice(el.dataset.i, 1); changed(); keepScroll(render); },
  addBrand(el) { const a = el.dataset.area; const v = $("#ab-" + a).value.trim(); if (v && !S.brands[a].includes(v)) { S.brands[a].push(v); changed(); } keepScroll(render); },
  rmAction(el) { S.actions.splice(el.dataset.i, 1); changed(); keepScroll(render); },
  addAction() { const v = $("#newAction").value.trim(); if (v && !S.actions.includes(v)) { S.actions.push(v); changed(); } keepScroll(render); },
  async wipe() {
    const o = openSheet("Borrar todos los datos", `<p>Esto borra las farmacias, ventas, visitas y rutas de este iPad. Guarda un respaldo antes si lo vas a necesitar.</p><label class="field" style="margin-top:14px"><span>Escribe borrar para confirmar</span><input type="text" id="wpT" autocomplete="off"></label><div class="row" style="justify-content:flex-end;margin-top:16px"><button class="btn danger" id="wpGo">Borrar todo</button></div>`);
    $("#wpGo", o).onclick = async () => { if ($("#wpT", o).value.trim().toLowerCase() !== "borrar") { toast("Escribe borrar para confirmar"); return; } S = freshState(null); changed(); await saveNow(); closeSheet(); go("hoy"); toast("Datos borrados"); };
  },
};
const CH = {
  setViewDate(el) { viewDate = el.value || today(); planDraft = null; render(); },
  setRepDate(el) { repDate = el.value || today(); render(); },
  vCollect(el) { const id = el.dataset.id; if (el.checked) draft.collect[id] = {amount: r2(el.dataset.bal), method: "Cheque"}; else delete draft.collect[id]; draft.dirty = true; keepScroll(render); },
  phSort(el) { phFilter.sort = el.value; render(); },
  restore(el) { const f = el.files[0]; if (f) restoreBackup(f); el.value = ""; },
};
const IN = { phSearch(el) { phFilter.q = el.value; const xs = filteredPharmacies(); $("#phList").innerHTML = phListHTML(xs); $("#phCount").textContent = plural(xs.length, "farmacia", "farmacias") + (phFilter.pueblo ? " en " + phFilter.pueblo : ""); } };
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const f = A[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener("keydown", e => {
  if ((e.key === "Enter" || e.key === " ") && e.target.matches(".chart .hit")) { e.preventDefault(); A.dashMonth(e.target); }
  if (e.key === "Escape" && $("#sheet")) closeSheet();
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.actChange && CH[el.dataset.actChange]) return CH[el.dataset.actChange](el);
  if (el.dataset.prod != null) {
    const p = S.products[el.dataset.prod]; const f = el.dataset.f;
    p[f] = el.type === "checkbox" ? el.checked : f === "price" ? r2(el.value) : el.value;
    changed(); if (f !== "name") keepScroll(render); return;
  }
  if (el.dataset.set) { const raw = el.value; const v = el.type === "number" ? Number(raw) : raw; setPath(S.settings, el.dataset.set, v); changed(); keepScroll(render); return; }
  if (el.dataset.setRadio) { setPath(S.settings, el.dataset.setRadio, el.value); changed(); keepScroll(render); return; }
  if (el.dataset.plan === "saveAs" && planDraft) { planDraft.saveAs = el.checked; if (el.checked && !planDraft.name) planDraft.name = defaultRouteName(planDraft.pueblos); keepScroll(render); return; }
  if (el.dataset.bindCheck && draft) { draft[el.dataset.bindCheck] = el.checked; draft.dirty = true; return; }
  if (el.dataset.bind === "date" && draft) { draft.date = el.value || today(); draft.dirty = true; keepScroll(render); return; }
  if (el.dataset.bind === "otherArea" && draft) { draft.otherArea = el.value; draft.dirty = true; return; }
  if (el.dataset.bindCollect && draft) { const c = draft.collect[el.dataset.id]; if (c) c[el.dataset.bindCollect] = el.dataset.bindCollect === "amount" ? r2(el.value) : el.value; draft.dirty = true; return; }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.dataset.actInput && IN[el.dataset.actInput]) return IN[el.dataset.actInput](el);
  if (el.dataset.plan === "name" && planDraft) { planDraft.name = el.value; return; }
  if (!draft) return;
  if (el.dataset.bind && el.dataset.bind !== "date" && el.dataset.bind !== "otherArea") { draft[el.dataset.bind] = el.value; draft.dirty = true; return; }
  if (el.dataset.bindItem) {
    const it = draft.items[el.dataset.i]; const f = el.dataset.bindItem;
    it[f] = f === "qty" ? Math.max(1, parseInt(el.value) || 1) : (parseFloat(el.value) || 0);
    if (f === "price") el.classList.toggle("need", !(it.price > 0));
    const lt = $(`[data-lt="${el.dataset.i}"]`); if (lt) lt.textContent = money(it.qty * it.price);
    const tt = $("#vTotal"); if (tt) tt.textContent = money(draft.items.reduce((a, i) => a + i.qty * i.price, 0));
    draft.dirty = true; return;
  }
  if (el.dataset.bindInv) { draft.inventory[el.dataset.bindInv] = el.value === "" ? "" : Math.max(0, parseInt(el.value) || 0); draft.dirty = true; return; }
  if (el.dataset.bindCollect) { const c = draft.collect[el.dataset.id]; if (c && el.dataset.bindCollect === "amount") c.amount = r2(el.value); draft.dirty = true; }
});

boot();
</script>
